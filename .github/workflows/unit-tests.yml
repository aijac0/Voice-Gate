name: Unit tests

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ctest:
    name: CTest (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            webrtc: 'OFF'
            cxx_flags: '-fsanitize=address,undefined -fno-omit-frame-pointer'
          - runner: macos-15
            webrtc: 'ON'
            cxx_flags: ''
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build pinned WebRTC AudioProcessing
        if: matrix.webrtc == 'ON'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          if ! command -v meson >/dev/null 2>&1; then
            brew install meson
          fi
          ./tools/build_webrtc_apm.sh
          printf 'PKG_CONFIG_PATH=%s\n' "$GITHUB_WORKSPACE/build/webrtc-apm/install/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Configure CMake
        env:
          WEBRTC: ${{ matrix.webrtc }}
          CXX_FLAGS: ${{ matrix.cxx_flags }}
        run: cmake -S . -B build -DBUILD_TESTING=ON -DVOICE_GATE_ENABLE_WEBRTC="$WEBRTC" -DCMAKE_CXX_FLAGS="$CXX_FLAGS"

      - name: Build tests
        run: cmake --build build --parallel

      - name: Run CTest
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Run trusted signaling tests
        if: matrix.runner == 'ubuntu-24.04'
        run: python3 -B -m unittest discover -s server -v

  web-rtc-loopback:
    name: Native WebRTC loopback (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build pinned WebRTC media dependencies
        run: ./tools/build_webrtc_media.sh

      - name: Configure native media
        run: |
          cmake -S . -B build-transport -DVOICE_GATE_ENABLE_WEBRTC_MEDIA=ON \
            -DCMAKE_PREFIX_PATH="$PWD/build-native-webrtc/install/datachannel;$PWD/build-native-webrtc/install/opus;$PWD/build-native-webrtc/install/json"

      - name: Build and test the local peer connection
        run: |
          cmake --build build-transport --target voice_gate_webrtc_loopback_test voice_gate_signaling_client_test voice_gate_live_probe --parallel
          ctest --test-dir build-transport --output-on-failure --no-tests=error -R '^(webrtc_loopback|signaling_client)$'
